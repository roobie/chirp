name: release

on:
  # A tag publishes. A manual run does everything except create the release,
  # so the packaging and attestation can be proven before a real tag.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release ships the bytes that this run's CI built, compared and ran.
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-24.04
    # The release key lives in the release environment, which allows only v*
    # tags, so a manual run cannot have it and takes no environment at all.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    outputs:
      version: ${{ steps.layout.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Copy a only; the compare job showed copy b is identical.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chirp-*-a
          path: artifacts
      # A tag signs with the release key and checks against the key the shipped
      # binaries trust. A manual run proves the same code paths with a key made
      # here and thrown away: it never has the real one.
      - name: Choose the signing key
        run: |
          if [ "$REF_TYPE" = tag ]; then
            { echo KEY_ENV=CHIRP_RELEASE_SIGNING_KEY
              echo PUBLIC_KEY=src/chirp/release-key.pem; } >> "$GITHUB_ENV"
          else
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/throwaway.key"
            openssl pkey -in "$RUNNER_TEMP/throwaway.key" -pubout -out "$RUNNER_TEMP/throwaway.pub"
            { echo KEY_ENV=CHIRP_THROWAWAY_SIGNING_KEY
              echo PUBLIC_KEY="$RUNNER_TEMP/throwaway.pub"
              echo "CHIRP_THROWAWAY_SIGNING_KEY<<END_OF_KEY"
              cat "$RUNNER_TEMP/throwaway.key"
              echo END_OF_KEY; } >> "$GITHUB_ENV"
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
      # The version comes from the binary being shipped, not from a file.
      # chirp --self-update trusts the signature and nothing else in the release.
      # The shipped linux-x64 binary does the work, which also keeps the signing
      # code exercised by every release.
      - name: Lay out and sign the release
        id: layout
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          # Only this step has the secret, and only on a tag.
          CHIRP_RELEASE_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.CHIRP_RELEASE_SIGNING_KEY || '' }}
        run: |
          chmod +x artifacts/chirp-linux-x64-a/chirp
          tag=
          [ "$REF_TYPE" = tag ] && tag=$REF_NAME
          version=$(artifacts/chirp-linux-x64-a/chirp tools/release/layout.janet release \
            artifacts out/release --pub "$PUBLIC_KEY" --key-env "$KEY_ENV" ${tag:+--tag "$tag"})
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat out/release/SHA256SUMS

          notes=$(< .github/release-notes.md)
          printf '%s\n' "${notes//@VERSION@/$version}" > out/notes.md

          # The changelog is the single source of what changed. A dry run has a
          # -dev version with no section of its own, so it shows Unreleased.
          slug=changelog/${version//./-}
          if ! section=$(artifacts/chirp-linux-x64-a/chirp --help read "$slug" 2>/dev/null); then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::CHANGELOG.md has no '## $version' section"
              exit 1
            fi
            section=$(artifacts/chirp-linux-x64-a/chirp --help read changelog/unreleased)
          fi
          # The heading is replaced so the notes read as one page under the release title.
          printf '\n## Changes\n%s\n' "$(tail -n +2 <<< "$section")" >> out/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.layout.outputs.version }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # The only job that can write: it attests the files and creates the release.
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.package.outputs.version }}
          path: dl
      # Also on a manual run, so the dry run proves attestation works.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dl/release/*
      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          flags=
          case "$VERSION" in *-*) flags=--prerelease ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dl/release/* \
            --title "chirp $VERSION" \
            --notes-file dl/notes.md \
            --verify-tag \
            $flags

  # An issue that landed on main closes when the release carrying it ships: the
  # open issues on the milestone named for the version, then the milestone.
  # A version with no milestone has nothing to close.
  close-milestone:
    needs: [package, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Close the milestone's issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          milestone=$(gh api "repos/$GH_REPO/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$VERSION\") | .number")
          if [ -z "$milestone" ]; then
            echo "no open milestone $VERSION"
            exit 0
          fi
          url="https://github.com/$GH_REPO/releases/tag/$TAG"
          for issue in $(gh issue list --milestone "$VERSION" --state open --limit 500 --json number --jq '.[].number'); do
            gh issue close "$issue" --reason completed --comment "Shipped in [chirp $VERSION]($url)."
          done
          gh api -X PATCH "repos/$GH_REPO/milestones/$milestone" -f state=closed --jq '"closed milestone \(.title)"'
