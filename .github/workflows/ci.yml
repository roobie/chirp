name: ci

on:
  # Branches only: a tag push is built by the release workflow, which calls
  # this one, so CI does not run twice for it.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Every target is built twice, cold, in different directories on different
  # runners. The container mounts the output directory at its own host path, so
  # different directories also prove the path does not leak into the binary.
  build:
    name: build ${{ matrix.target }} (${{ matrix.copy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A new target is a new entry here, a key of :targets in
        # tools/build/config.jdn, and an entry in the smoke matrix below.
        target: [linux-x64, linux-arm64, macos-arm64, windows-x64]
        copy: [a, b]
        include:
          - copy: a
            dir: a
          - copy: b
            dir: b/nested/deeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ runner.temp }}/${{ matrix.dir }}
        run: sh tools/build/container.sh "$TARGET" "$OUT"
      # Only bin/ is compared and run; the rest of the build tree is scratch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chirp-${{ matrix.target }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/${{ matrix.dir }}/bin/
          if-no-files-found: error
          retention-days: 7

  # The reproducibility claim: both copies of a target are the same bytes.
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chirp-*
          path: artifacts
      - name: Compare sha256 of every file in both copies
        run: |
          status=0
          {
            echo '| target | file | copy a | copy b | result |'
            echo '|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for a in artifacts/chirp-*-a; do
            target=${a#artifacts/chirp-}
            target=${target%-a}
            b=artifacts/chirp-$target-b
            # The union of both file lists, so a file only one copy has is
            # reported as missing instead of skipped.
            for f in $( (ls "$a"; ls "$b" 2>/dev/null) | sort -u); do
              ha=missing; hb=missing
              [ -f "$a/$f" ] && ha=$(sha256sum "$a/$f" | cut -d' ' -f1)
              [ -f "$b/$f" ] && hb=$(sha256sum "$b/$f" | cut -d' ' -f1)
              if [ "$ha" = "$hb" ] && [ "$ha" != missing ]; then result=identical; else result=DIFFERENT; status=1; fi
              echo "$target $f: $result ($ha, $hb)"
              echo "| $target | $f | \`$ha\` | \`$hb\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit $status

  # Run each binary on a native machine of its own platform; the build runners
  # are all linux x64, so this is the only place the other targets execute.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on windows; the driver itself is Janet, run by chirp.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            exe: chirp
          - target: linux-arm64
            os: ubuntu-24.04-arm
            exe: chirp
          # windows-2025 rather than windows-latest: the image does not change
          # under us, same as the pinned ubuntu runners.
          - target: windows-x64
            os: windows-2025
            exe: chirp.exe
          - target: macos-arm64
            os: macos-15
            exe: chirp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-${{ matrix.target }}-a
          path: dist
      # Windows has no OpenSSL cert locations and no embedded roots yet, so
      # point at the CA bundle that Git for Windows ships. Other runners use
      # the system store, which chirp finds itself.
      - name: Use the Git for Windows CA bundle
        if: runner.os == 'Windows'
        # Its location moves between Git releases, so search the install.
        run: |
          bundle=$(find "$(cygpath -u "$PROGRAMFILES")/Git" -name ca-bundle.crt -path '*ssl*' | head -n1)
          test -n "$bundle"
          echo "using $bundle"
          echo "SSL_CERT_FILE=$(cygpath -m "$bundle")" >> "$GITHUB_ENV"
      # Artifacts do not keep the executable bit.
      - name: Smoke checks
        env:
          EXE: dist/${{ matrix.exe }}
        run: |
          chmod +x "$EXE"
          "$EXE" test/smoke/run.janet

  # Dogfood: chirp, not a separate janet install, runs the repo checks. The
  # environment is cleared so only the generic rules apply; leakcheck would
  # otherwise add the CI runner's own user, home and hostname as host values.
  leakcheck:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-linux-x64-a
          path: dist
      - name: Leakcheck
        run: |
          chmod +x dist/chirp
          env -i PATH="$PATH" ./dist/chirp tools/leakcheck/leakcheck.janet all
          env -i PATH="$PATH" ./dist/chirp tools/leakcheck/test.janet
