name: ci

on:
  # Branches only: a tag push is built by the release workflow, which calls
  # this one, so CI does not run twice for it.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Whether this run builds. A push that changes nothing outside .work/ (the
  # work-tracking documents, which never reach the image) builds nothing: the
  # jobs below are skipped and the run is green, with only the checks job
  # having run. Everything else builds: a new branch, a forced push, a pull
  # request, and a call from the release or pages workflow, where the event is
  # the caller's. See D-SBFT5Y7OGHMOVIY6.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          SHA: ${{ github.sha }}
        run: |
          build=true
          if [ "$EVENT" = push ] && [ "$REF_TYPE" = branch ] && [ "$FORCED" = false ] &&
             git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Any doubt builds: the list has to be read, non-empty, and all .work/.
            if files=$(git diff --name-only "$BEFORE" "$SHA") && [ -n "$files" ] &&
               ! printf '%s\n' "$files" | grep -qv '^\.work/'; then
              build=false
              echo "::notice::only .work/ changed between $BEFORE and $SHA, so nothing is built"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  # Every target is built twice, cold, in different directories on different
  # runners. The container mounts the output directory at its own host path, so
  # different directories also prove the path does not leak into the binary.
  build:
    name: build ${{ matrix.target }} (${{ matrix.copy }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # A new target is a new entry here, a key of :targets in
        # tools/build/config.jdn, and an entry in the smoke matrix below.
        # wasm32-wasi is not released; the site's try page runs it, and the
        # wasm job below checks it.
        target: [linux-x64, linux-arm64, macos-arm64, windows-x64, wasm32-wasi]
        copy: [a, b]
        include:
          - copy: a
            dir: a
          - copy: b
            dir: b/nested/deeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          OUT: ${{ runner.temp }}/${{ matrix.dir }}
        run: sh tools/build/container.sh "$TARGET" "$OUT"
      # Only bin/ is compared and run; the rest of the build tree is scratch.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chirp-${{ matrix.target }}-${{ matrix.copy }}
          path: ${{ runner.temp }}/${{ matrix.dir }}/bin/
          if-no-files-found: error
          retention-days: 7

  # The reproducibility claim: both copies of a target are the same bytes.
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: chirp-*
          path: artifacts
      - name: Compare sha256 of every file in both copies
        run: |
          status=0
          {
            echo '| target | file | copy a | copy b | result |'
            echo '|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          for a in artifacts/chirp-*-a; do
            target=${a#artifacts/chirp-}
            target=${target%-a}
            b=artifacts/chirp-$target-b
            # The union of both file lists, so a file only one copy has is
            # reported as missing instead of skipped.
            for f in $( (ls "$a"; ls "$b" 2>/dev/null) | sort -u); do
              ha=missing; hb=missing
              [ -f "$a/$f" ] && ha=$(sha256sum "$a/$f" | cut -d' ' -f1)
              [ -f "$b/$f" ] && hb=$(sha256sum "$b/$f" | cut -d' ' -f1)
              if [ "$ha" = "$hb" ] && [ "$ha" != missing ]; then result=identical; else result=DIFFERENT; status=1; fi
              echo "$target $f: $result ($ha, $hb)"
              echo "| $target | $f | \`$ha\` | \`$hb\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit $status

  # Run each binary on a native machine of its own platform; the build runners
  # are all linux x64, so this is the only place the other targets execute.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        # Git Bash on windows; the driver itself is Janet, run by chirp.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
            exe: chirp
          - target: linux-arm64
            os: ubuntu-24.04-arm
            exe: chirp
          # windows-2025 rather than windows-latest: the image does not change
          # under us, same as the pinned ubuntu runners.
          - target: windows-x64
            os: windows-2025
            exe: chirp.exe
          - target: macos-arm64
            os: macos-15
            exe: chirp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-${{ matrix.target }}-a
          path: dist
      # Artifacts do not keep the executable bit.
      - name: Smoke checks
        env:
          EXE: dist/${{ matrix.exe }}
        run: |
          chmod +x "$EXE"
          "$EXE" test/smoke/run.janet

  # chirp.wasm under Node through the try page's WASI host, its help compared
  # with the native build's, then the try page itself in headless Chrome.
  wasm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The full history, because the site's commit links are checked against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Node 22 for its built-in WebSocket, which drives Chrome.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-wasm32-wasi-a
          path: wasm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-linux-x64-a
          path: dist
      - name: Smoke checks
        run: |
          chmod +x dist/chirp
          node test/wasm/smoke.mjs wasm/chirp.wasm dist/chirp
      - name: Try page
        run: |
          dist/chirp site/build.janet out/site --wasm wasm/chirp.wasm
          dist/chirp site/check.janet out/site
          node test/wasm/page.mjs out/site

  # The repo checks and every *.test.janet, run by a released chirp pinned in
  # pins.jdn, so they need no build and report in seconds while the targets
  # build. The binaries this run builds are exercised by the smoke job. The
  # environment is cleared so only the generic rules apply; leakcheck would
  # otherwise add the CI runner's own user, home and hostname as host values.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned chirp
        run: |
          curl -fsSL -o "$RUNNER_TEMP/chirp" "$(sh tools/build/pin.sh chirp url)"
          echo "$(sh tools/build/pin.sh chirp sha256)  $RUNNER_TEMP/chirp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/chirp"
          "$RUNNER_TEMP/chirp" --version
      - name: Checks
        run: |
          env -i PATH="$PATH" "$RUNNER_TEMP/chirp" tools/leakcheck/leakcheck.janet all
          env -i PATH="$PATH" "$RUNNER_TEMP/chirp" tools/skillcheck/skillcheck.janet
      # A new test needs no line here: the driver finds every *.test.janet.
      - name: Tests
        run: env -i PATH="$PATH" "$RUNNER_TEMP/chirp" tools/test.janet
