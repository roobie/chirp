name: pages

# The site describes a release, so it is published after the release workflow
# succeeds for a tag, built by the binary that release shipped. A manual run
# republishes from a commit between releases, such as a dev-proc change, and
# builds chirp for it first.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A manual run only: a release run already holds the binary it built.
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    # The release workflow's manual runs are dry runs, so only its tag runs count.
    if: >-
      always() &&
      (needs.ci.result == 'success' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      # The full history, because the site's commit links are checked against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      # From this run (manual) or from the release run that triggered this one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-linux-x64-a
          path: bin
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build the site
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x bin/chirp
          bin/chirp site/build.janet out/site
      - name: Check the site
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          bin/chirp site/check.janet out/site --commit "$COMMIT" \
            --chirp-version "$(bin/chirp --version | cut -d' ' -f2)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/site

  # The only job that can write to Pages.
  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The deployed site, checked by the same rules. Pages can serve the previous
  # deploy for a while, so the check waits until the footer names this commit.
  verify:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chirp-linux-x64-a
          path: bin
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Check the live site
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          chmod +x bin/chirp
          bin/chirp site/check.janet "$URL" --commit "$COMMIT" --wait 600 \
            --chirp-version "$(bin/chirp --version | cut -d' ' -f2)"
